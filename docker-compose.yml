version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
      network: host
    container_name: tripdeck-backend
    image: fong/tripdeck-backend
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    network_mode: host
    environment:
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: ${DB_NAME:-tripdeck}
      VITE_API_PORT: ${VITE_API_PORT:-3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      AUTO_BACKUP_ENABLED: ${AUTO_BACKUP_ENABLED:-true}
      AUTO_BACKUP_INTERVAL_DAYS: ${AUTO_BACKUP_INTERVAL_DAYS:-15}
      AUTO_BACKUP_CHECK_INTERVAL_HOURS: ${AUTO_BACKUP_CHECK_INTERVAL_HOURS:-24}
      AUTO_BACKUP_RETENTION_COUNT: ${AUTO_BACKUP_RETENTION_COUNT:-6}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      LOG_FILENAME: ${LOG_FILENAME:-app.log}
      LOG_MAX_SIZE_MB: ${LOG_MAX_SIZE_MB:-10}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-5}
      OWM_API_KEY_FILE: /run/secrets/owm_api_key
      VC_API_KEY_FILE: /run/secrets/vc_api_key
    secrets:
      - db_password
      - owm_api_key
      - vc_api_key
    volumes:
      - ${UPLOADS_HOST_DIR:-./.uploads}:/app/uploads
      - ${BACKUPS_HOST_DIR:-./.backups}:/app/backups
      - ${LOGS_HOST_DIR:-./.logs}:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${VITE_API_PORT:-3001}/api/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      network: host
      args:
        FRONTEND_PORT: ${FRONTEND_PORT:-3000}
        VITE_API_DOMAIN: ${VITE_API_DOMAIN:-}
        VITE_API_PORT: ${VITE_API_PORT:-3001}
        VITE_API_PUBLIC_PORT: ${VITE_API_PUBLIC_PORT:-}
    container_name: tripdeck-frontend
    image: fong/tripdeck-frontend
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    network_mode: host
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      VITE_API_PORT: ${VITE_API_PORT:-3001}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${FRONTEND_PORT:-3000} || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3

# Sensitive values are handed to the backend as files under /run/secrets/
# instead of environment variables, so they don't show up in `docker inspect`
# or the container's process environment. Each one is still sourced from the
# variable of the same name in `.env` (or the Portainer stack variables), so
# that variable must be defined there -- an empty value is fine.
secrets:
  db_password:
    environment: DB_PASSWORD
  owm_api_key:
    environment: OWM_API_KEY
  vc_api_key:
    environment: VC_API_KEY
