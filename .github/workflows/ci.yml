name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 0 15 * *' # Monthly full security scan
  workflow_dispatch: # Manual full run

# Cancel superseded runs of the same PR; never cancel runs on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci:
    uses: Fong0975/library-shared-workflows/.github/workflows/ci.yml@v1
    # Every scope below is required, even when a stage is disabled: GitHub checks
    # the permissions of all nested jobs when the run starts.
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    with:
      # `format` runs the repository-wide Prettier check on its own so that a
      # server-only change still verifies JSON/CSS formatting. Type-checking is
      # part of each workspace's `build` (tsc), hence the empty `typecheck`.
      projects: |
        [
          {
            "name": "format",
            "language": "node",
            "paths": ["**/*.{ts,tsx,json,css}", ".prettierrc.json", ".prettierignore"],
            "format": "npm run format:check",
            "lint": "",
            "typecheck": "",
            "test": "",
            "build": ""
          },
          {
            "name": "client",
            "language": "node",
            "paths": ["client/**", "package.json", "package-lock.json", ".nvmrc", ".prettierrc.json", ".prettierignore"],
            "format": "",
            "lint": "npm run lint:check -w client",
            "typecheck": "",
            "test": "npm run test:coverage -w client",
            "build": "npm run build -w client",
            "test-results": "client/test-results.json",
            "coverage-file": "client/coverage/coverage-summary.json",
            "coverage-threshold": 80
          },
          {
            "name": "server",
            "language": "node",
            "paths": ["server/**", "package.json", "package-lock.json", ".nvmrc", ".prettierrc.json", ".prettierignore"],
            "format": "",
            "lint": "npm run lint:check -w server",
            "typecheck": "",
            "test": "npm run test:coverage -w server",
            "build": "npm run build -w server",
            "test-results": "server/test-results.json",
            "coverage-file": "server/coverage/coverage-summary.json",
            "coverage-threshold": 80
          }
        ]
      enable-security-scan: true
      semgrep-configs: p/security-audit p/owasp-top-ten p/typescript p/react
      enable-swagger: false
      enable-bump-version: true
      bump-level: minor
      npm-workspaces: '["client", "server"]'
